name: CI React Docker & Kubernetes

on:
  push:
    branches: [ "main" ]

jobs:
  # Job 1: Construção e Push da Imagem Docker
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da Imagem Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/manupred_fe:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/manupred_fe:latest

  # Job 2: Implantação no Kubernetes via Runner Self-Hosted
  deploy-k8s:
    runs-on: self-hosted
    needs: docker-build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Aplicar Manifestos no Kubernetes
        run: kubectl apply -f k8s/deployment.yaml
