name: CI React Docker & Kubernetes

on:
  push:
    branches: [ "main" ]

jobs:
  # Job 1: Build da aplicação React
  build-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Dependências
        run: npm install

      - name: Build do Projeto
        run: npm run build

  # Job 2: Construção e Push da Imagem Docker
  docker-build:
    runs-on: ubuntu-latest
    needs: build-react
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da Imagem Docker
        run: docker build -t fiecpa2026 .

      - name: Tag e Push da Imagem
        run: |
          docker tag fiecpa2026 ${{ secrets.DOCKER_USERNAME }}/kipperfe:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/kipperfe:latest

  # Job 3: Implantação no Kubernetes via Runner Self-Hosted
  deploy-k8s:
    runs-on: self-hosted
    needs: docker-build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Aplicar Manifestos no Kubernetes
        run: kubectl apply -f k8s/deployment.yaml
